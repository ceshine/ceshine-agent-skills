# Pathspec patterns to exclude from git diff output.
# One pattern per line. Blank lines and lines starting with # are ignored.
# Override this file by setting GIT_SKILL_EXCLUDES (colon-separated patterns).
#
# Patterns are applied with ':(exclude,glob)' magic. Use '**/' prefixes to
# match at any depth — including the repository root, which a plain pathspec
# '**/foo' would NOT match (git pathspec quirk).
**/*.lock
**/package-lock.json
